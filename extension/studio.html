<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PageAtlas Studio</title><link rel="icon" href="icons/32.png"><link rel="stylesheet" href="studio.css"></head>
<body>
  <header class="topbar"><a class="brand" href="#"><img src="icons/32.png" alt=""><strong>PageAtlas <span>Studio</span></strong></a><span id="project-name"></span><span id="save-state" role="status"></span><div class="top-actions"><select id="language" aria-label="Language"><option value="en">English</option><option value="he">עברית</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option></select><select id="theme" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select><button id="backup" data-i="backup">Save project</button><button id="export" class="primary" data-i="export">Export</button></div></header>
  <div class="workspace"><aside class="rail"><nav id="tools" aria-label="Studio"></nav><div class="project-heading"><strong data-i="projects">Projects</strong><button id="new" data-i="new">New</button></div><div id="projects"></div><div class="rail-footer"><a href="https://github.com/usdrawing/PageAtlas/blob/main/docs/privacy.md" target="_blank" data-i="privacy">Privacy</a><a href="https://github.com/usdrawing/PageAtlas/blob/main/docs/terms.md" target="_blank" data-i="terms">Terms</a></div></aside><main id="main"></main><aside id="inspector" aria-label="Properties"></aside></div>
  <div id="notice" role="status" hidden></div><input id="upload" type="file" accept="image/*,.json,.pageatlas" multiple hidden><dialog id="modal"><div id="modal-body"></div><form method="dialog"><button data-i="close">Close</button></form></dialog>
  <script src="projects.js"></script><script src="studio-i18n.js"></script><script src="studio-render.js"></script><script src="studio-pptx.js"></script><script src="studio.js"></script>
</body></html>
